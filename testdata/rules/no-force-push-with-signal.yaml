when: |
  tool == "Bash"
  && input.commands.exists(c,
       c.name == "git"
       && c.git_subcommand == "push"
       && c.git_args.exists(a,
            a == "--force"
            || a.startsWith("--force-with-lease")
            || (a.startsWith("-") && !a.startsWith("--") && a.contains("f"))
          )
     )
  && !("force-push" in session.signals)
action: deny
message: "Force-push is blocked. Only after the user or controlling workflow authorizes this exact exception, record it with: ward allow force-push"
