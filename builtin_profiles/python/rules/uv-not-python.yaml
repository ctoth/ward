when: |
  tool == "Bash"
  && input.commands.exists(c,
       c.name.startsWith("python")
       && !c.via.exists(w, w in ["uv", "uvx", "poetry", "pdm", "rye", "pipenv", "npx"])
     )
  && facts.has_pyproject
  && !("bare-python" in session.signals)
action: deny
message: "Use `uv run python` instead of bare python. Run: ward allow bare-python"
