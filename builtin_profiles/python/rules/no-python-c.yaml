when: |
  tool == "Bash"
  && input.commands.exists(c,
       c.name.startsWith("python")
       && c.args.exists(a,
            a.startsWith("-") && !a.startsWith("--") && a.contains("c")
          )
     )
  && !("python-c" in session.signals)
action: deny
message: "Write a .py file, then run it. Only after the user or controlling workflow authorizes this exact exception, record it with: ward allow python-c"
