when: |
  tool == "Bash"
  && input.commands.exists(c,
       c.name == "git"
       && c.git_subcommand == "push"
       && c.git_args.exists(a, a == "--force" || a == "-f")
     )
  && !("force-push" in session.signals)
action: deny
message: "Force-push requires explicit permission. Run: ward allow force-push"
